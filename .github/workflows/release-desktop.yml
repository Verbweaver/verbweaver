name: Release Desktop

on:
  push:
    branches:
      - release-testing
      - main
    tags:
      - 'v*.*.*'

jobs:
  build-release:
    name: Build and release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
          - os: macos-latest
            mac_arch: arm64
          - os: macos-latest
            mac_arch: x64

    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Ensure LFS files are present
        shell: bash
        run: |
          set -e
          git lfs install
          git lfs pull
          # Sanity check sizes to avoid packaging LFS pointers
          if [ -d desktop/resources/tools ]; then
            echo "Listing tools disk usage:"
            du -k desktop/resources/tools | head -n 50 || true
          fi

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build backend binary (PyInstaller)
        working-directory: backend
        run: |
          pyinstaller --onefile entry.py --name verbweaver-backend --hidden-import itsdangerous --hidden-import aiosqlite --hidden-import passlib.handlers.bcrypt --hidden-import webauthn.helpers.exceptions --hidden-import fontTools.ttLib.tables._n_a_m_e

      - name: Prepare backend binary in desktop resources
        shell: bash
        run: |
          mkdir -p desktop/resources/backend/win desktop/resources/backend/mac desktop/resources/backend/linux
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp backend/dist/verbweaver-backend.exe desktop/resources/backend/win/verbweaver-backend.exe
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            cp backend/dist/verbweaver-backend desktop/resources/backend/mac/verbweaver-backend
            chmod +x desktop/resources/backend/mac/verbweaver-backend
          else
            cp backend/dist/verbweaver-backend desktop/resources/backend/linux/verbweaver-backend
            chmod +x desktop/resources/backend/linux/verbweaver-backend
          fi

      - name: Install Node deps (workspaces)
        working-directory: .
        run: npm ci

      - name: Build shared and frontend (workspaces)
        working-directory: .
        run: |
          npm run build:shared
          npm run build:frontend

      - name: Build desktop (electron-vite)
        working-directory: desktop
        run: npm run build

      - name: Prune bundled tools for target platform
        shell: bash
        run: |
          set -e
          TOOLS_DIR="desktop/resources/tools"
          if [ ! -d "$TOOLS_DIR" ]; then
            echo "No tools directory to prune"
            exit 0
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            rm -rf "$TOOLS_DIR/mac" "$TOOLS_DIR/linux"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            rm -rf "$TOOLS_DIR/win" "$TOOLS_DIR/linux"
            if [ "${{ matrix.mac_arch }}" = "arm64" ]; then
              rm -rf "$TOOLS_DIR/mac/x86_64"
            else
              rm -rf "$TOOLS_DIR/mac/arm64"
            fi
          else
            rm -rf "$TOOLS_DIR/win" "$TOOLS_DIR/mac"
            ARCH="$(uname -m)"
            if [ "$ARCH" = "x86_64" ] || [ "$ARCH" = "amd64" ]; then
              rm -rf "$TOOLS_DIR/linux/arm64"
            else
              rm -rf "$TOOLS_DIR/linux/amd64"
            fi
          fi

      - name: Expose git metadata to desktop (for publish)
        shell: bash
        run: |
          rm -rf desktop/.git || true
          cp -r .git desktop/.git

      - name: Set code signing env (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [[ -n "${{ secrets.WIN_CSC_LINK }}" ]]; then
            echo "CSC_LINK=${{ secrets.WIN_CSC_LINK }}" >> $GITHUB_ENV
            echo "CSC_KEY_PASSWORD=${{ secrets.WIN_CSC_KEY_PASSWORD }}" >> $GITHUB_ENV
          fi

      - name: Set code signing env (macOS)
        if: runner.os == 'macOS' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release-testing' || startsWith(github.ref, 'refs/tags/'))
        shell: bash
        run: |
          # Import Developer ID cert from secrets for signing
          if [[ -n "${{ secrets.CSC_LINK }}" ]]; then
            echo "CSC_LINK=${{ secrets.CSC_LINK }}" >> $GITHUB_ENV
          fi
          if [[ -n "${{ secrets.CSC_KEY_PASSWORD }}" ]]; then
            echo "CSC_KEY_PASSWORD=${{ secrets.CSC_KEY_PASSWORD }}" >> $GITHUB_ENV
          fi
          # Apple account creds for notarization (not needed for signing itself)
          if [[ -n "${{ secrets.APPLE_ID }}" ]]; then
            echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> $GITHUB_ENV
            echo "APPLE_APP_SPECIFIC_PASSWORD=${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" >> $GITHUB_ENV
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> $GITHUB_ENV
          fi

      - name: Package desktop app (unsigned mac; signed win/linux) on other branches
        if: startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/release-testing'
        working-directory: desktop
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            npx electron-builder --win --publish never
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            if [[ "${{ matrix.mac_arch }}" == "arm64" ]]; then
              npx electron-builder --mac --arm64 --publish never
            else
              npx electron-builder --mac --x64 --publish never
            fi
          else
            npx electron-builder --linux --publish never
          fi

      # release-testing is the last gate before a release, so it is signed and notarized like main
      # to catch signing problems (#32) before they ship. Release tags (vX.Y.Z) package the same way;
      # the `publish` job below uploads the result, so no matrix job publishes on its own (#17).
      - name: Package desktop app (signed on main, release-testing and release tags)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release-testing' || startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        shell: bash
        env:
          # mac signing/notarization
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # windows signing
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # Map Windows-specific secrets to generic env expected by electron-builder
            if [[ -n "$WIN_CSC_LINK" ]]; then export CSC_LINK="$WIN_CSC_LINK"; fi
            if [[ -n "$WIN_CSC_KEY_PASSWORD" ]]; then export CSC_KEY_PASSWORD="$WIN_CSC_KEY_PASSWORD"; fi
            npx electron-builder --win --publish never
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            if [[ "${{ matrix.mac_arch }}" == "arm64" ]]; then
              npx electron-builder --mac --arm64 --publish never
            else
              npx electron-builder --mac --x64 --publish never
            fi
          else
            npx electron-builder --linux --publish never
          fi

      # electron-builder signs, notarizes and staples the .app before it builds the DMG/ZIP.
      # This step checks that each shipped form of the app passes Gatekeeper, and fails the job if any doesn't.
      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release-testing' || startsWith(github.ref, 'refs/tags/'))
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          verify_app() {
            local app="$1"
            echo "::group::Verify $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose=2 "$app"
            xcrun stapler validate "$app"
            echo "::endgroup::"
          }
          found=0
          while IFS= read -r -d '' app; do
            verify_app "$app"; found=1
          done < <(find dist-app -maxdepth 2 -type d -name "*.app" -print0)
          while IFS= read -r -d '' dmg; do
            mnt="$(mktemp -d)"
            hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
            for app in "$mnt"/*.app; do verify_app "$app"; done
            hdiutil detach "$mnt"
          done < <(find dist-app -maxdepth 1 -type f -name "*.dmg" -print0)
          while IFS= read -r -d '' zip; do
            out="$(mktemp -d)"
            ditto -x -k "$zip" "$out"
            for app in "$out"/*.app; do verify_app "$app"; done
          done < <(find dist-app -maxdepth 1 -type f -name "*.zip" -print0)
          if [[ "$found" -eq 0 ]]; then echo "::error::No .app bundle found in dist-app"; exit 1; fi

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v6
        with:
          # Ship distributables only. upload-artifact replaces symlinks with copies, which breaks
          # the signed macOS .app bundle (#32), and unpacked dirs/debug files are not deliverables.
          name: ${{ matrix.os == 'ubuntu-latest' && 'desktop-linux-latest' || (matrix.os == 'macos-latest' && format('desktop-macos-latest-{0}', matrix.mac_arch) || format('desktop-{0}', matrix.os)) }}
          path: |
            desktop/dist-app/**
            !desktop/dist-app/**/*.msix
            !desktop/dist-app/**/*.appx
            !desktop/dist-app/mac/**
            !desktop/dist-app/mac-*/**
            !desktop/dist-app/*-unpacked/**
            !desktop/dist-app/builder-debug.yml
          if-no-files-found: error
          retention-days: 7

  # Creates a DRAFT GitHub Release from the matrix builds. Review it, then publish it by hand.
  # electron-updater needs latest.yml (Windows), latest-mac.yml and latest-linux.yml on the release (#17).
  publish:
    name: Create draft release
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check tag matches app version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(jq -r .version desktop/package.json)"
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "::error::Tag $TAG does not match desktop/package.json version $VERSION (expected v$VERSION)"
            exit 1
          fi

      - name: Download packaged artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Merge macOS update metadata
        shell: bash
        run: |
          set -euo pipefail
          # Each mac arch job writes its own latest-mac.yml. electron-updater expects one file
          # listing both arches, and it picks the -arm64 asset on Apple silicon.
          X64=artifacts/desktop-macos-latest-x64/latest-mac.yml
          ARM=artifacts/desktop-macos-latest-arm64/latest-mac.yml
          test -f "$X64" && test -f "$ARM"
          yq -i ".files += load(\"$ARM\").files" "$X64"
          rm "$ARM"
          cat "$X64"

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          # Raw distributables only. Never upload Actions artifact zips (see #32).
          while IFS= read -r -d '' f; do
            name="$(basename "$f")"
            if [[ -e "release/$name" ]]; then echo "::error::Duplicate asset name $name"; exit 1; fi
            mv "$f" "release/$name"
          done < <(find artifacts -maxdepth 2 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \
            -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.blockmap' \
            -o -name 'latest*.yml' \) -print0)
          ls -l release
          for f in latest.yml latest-mac.yml latest-linux.yml; do
            test -f "release/$f" || { echo "::error::Missing update metadata $f"; exit 1; }
          done

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          FLAGS=(--draft --verify-tag --generate-notes --title "$GITHUB_REF_NAME")
          # Tags like v1.2.3-rc.1 are prereleases; electron-updater skips them for stable users.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then FLAGS+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${FLAGS[@]}" release/*


