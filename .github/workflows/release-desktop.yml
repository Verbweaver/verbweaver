name: Release Desktop

on:
  push:
    branches:
      - release-testing
      - main
    tags:
      - 'v*.*.*'

jobs:
  build-release:
    name: Build and release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
          - os: macos-latest
            mac_arch: arm64
          - os: macos-latest
            mac_arch: x64

    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure LFS files are present
        shell: bash
        run: |
          set -e
          git lfs install
          git lfs pull
          # Sanity check sizes to avoid packaging LFS pointers
          if [ -d desktop/resources/tools ]; then
            echo "Listing tools disk usage:"
            du -k desktop/resources/tools | head -n 50 || true
          fi

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build backend binary (PyInstaller)
        working-directory: backend
        run: |
          pyinstaller --onefile entry.py --name verbweaver-backend --hidden-import itsdangerous --hidden-import aiosqlite --hidden-import passlib.handlers.bcrypt --hidden-import webauthn.helpers.exceptions

      - name: Prepare backend binary in desktop resources
        shell: bash
        run: |
          mkdir -p desktop/resources/backend/win desktop/resources/backend/mac desktop/resources/backend/linux
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp backend/dist/verbweaver-backend.exe desktop/resources/backend/win/verbweaver-backend.exe
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            cp backend/dist/verbweaver-backend desktop/resources/backend/mac/verbweaver-backend
            chmod +x desktop/resources/backend/mac/verbweaver-backend
          else
            cp backend/dist/verbweaver-backend desktop/resources/backend/linux/verbweaver-backend
            chmod +x desktop/resources/backend/linux/verbweaver-backend
          fi

      - name: Install Node deps (workspaces)
        working-directory: .
        run: npm ci

      - name: Build shared and frontend (workspaces)
        working-directory: .
        run: |
          npm run build:shared
          npm run build:frontend

      - name: Build desktop (electron-vite)
        working-directory: desktop
        run: npm run build

      - name: Prune bundled tools for target platform
        shell: bash
        run: |
          set -e
          TOOLS_DIR="desktop/resources/tools"
          if [ ! -d "$TOOLS_DIR" ]; then
            echo "No tools directory to prune"
            exit 0
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            rm -rf "$TOOLS_DIR/mac" "$TOOLS_DIR/linux"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            rm -rf "$TOOLS_DIR/win" "$TOOLS_DIR/linux"
            if [ "${{ matrix.mac_arch }}" = "arm64" ]; then
              rm -rf "$TOOLS_DIR/mac/x86_64"
            else
              rm -rf "$TOOLS_DIR/mac/arm64"
            fi
          else
            rm -rf "$TOOLS_DIR/win" "$TOOLS_DIR/mac"
            ARCH="$(uname -m)"
            if [ "$ARCH" = "x86_64" ] || [ "$ARCH" = "amd64" ]; then
              rm -rf "$TOOLS_DIR/linux/arm64"
            else
              rm -rf "$TOOLS_DIR/linux/amd64"
            fi
          fi

      - name: Expose git metadata to desktop (for publish)
        shell: bash
        run: |
          rm -rf desktop/.git || true
          cp -r .git desktop/.git

      - name: Set code signing env (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [[ -n "${{ secrets.WIN_CSC_LINK }}" ]]; then
            echo "CSC_LINK=${{ secrets.WIN_CSC_LINK }}" >> $GITHUB_ENV
            echo "CSC_KEY_PASSWORD=${{ secrets.WIN_CSC_KEY_PASSWORD }}" >> $GITHUB_ENV
          fi

      - name: Set code signing env (macOS)
        if: runner.os == 'macOS' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        shell: bash
        run: |
          # Import Developer ID cert from secrets for signing
          if [[ -n "${{ secrets.CSC_LINK }}" ]]; then
            echo "CSC_LINK=${{ secrets.CSC_LINK }}" >> $GITHUB_ENV
          fi
          if [[ -n "${{ secrets.CSC_KEY_PASSWORD }}" ]]; then
            echo "CSC_KEY_PASSWORD=${{ secrets.CSC_KEY_PASSWORD }}" >> $GITHUB_ENV
          fi
          # Apple account creds for notarization (not needed for signing itself)
          if [[ -n "${{ secrets.APPLE_ID }}" ]]; then
            echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> $GITHUB_ENV
            echo "APPLE_APP_SPECIFIC_PASSWORD=${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" >> $GITHUB_ENV
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> $GITHUB_ENV
          fi

      - name: Package desktop app (unsigned mac; signed win/linux) on branches except main
        if: startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main'
        working-directory: desktop
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            npx electron-builder --win --publish never
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            if [[ "${{ matrix.mac_arch }}" == "arm64" ]]; then
              npx electron-builder --mac --arm64 --publish never
            else
              npx electron-builder --mac --x64 --publish never
            fi
          else
            npx electron-builder --linux --publish never
          fi

      - name: Package desktop app (signed on main)
        if: github.ref == 'refs/heads/main'
        working-directory: desktop
        shell: bash
        env:
          # mac signing/notarization
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # windows signing
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # Map Windows-specific secrets to generic env expected by electron-builder
            if [[ -n "$WIN_CSC_LINK" ]]; then export CSC_LINK="$WIN_CSC_LINK"; fi
            if [[ -n "$WIN_CSC_KEY_PASSWORD" ]]; then export CSC_KEY_PASSWORD="$WIN_CSC_KEY_PASSWORD"; fi
            npx electron-builder --win --publish never
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            if [[ "${{ matrix.mac_arch }}" == "arm64" ]]; then
              npx electron-builder --mac --arm64 --publish never
            else
              npx electron-builder --mac --x64 --publish never
            fi
          else
            npx electron-builder --linux --publish never
          fi

      - name: Staple notarization ticket (macOS, main)
        if: github.ref == 'refs/heads/main' && runner.os == 'macOS'
        working-directory: desktop
        shell: bash
        run: |
          set -e
          echo "Stapling .app bundles..."
          find dist-app -type d -name "*.app" -print0 | xargs -0 -I{} xcrun stapler staple -v "{}" || true
          echo "Stapling DMG/ZIP artifacts..."
          find dist-app -type f \( -name "*.dmg" -o -name "*.zip" \) -print0 | xargs -0 -I{} xcrun stapler staple -v "{}" || true

      - name: Package desktop MSIX (no publish for branches)
        if: startsWith(github.ref, 'refs/heads/') && runner.os == 'Windows'
        working-directory: desktop
        shell: bash
        run: |
          # Build Windows MSIX/AppX package for Store submission
          npx electron-builder --win appx --publish never

      - name: Package and publish desktop app (tags/releases)
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            if [[ -n "$WIN_CSC_LINK" ]]; then export CSC_LINK="$WIN_CSC_LINK"; fi
            if [[ -n "$WIN_CSC_KEY_PASSWORD" ]]; then export CSC_KEY_PASSWORD="$WIN_CSC_KEY_PASSWORD"; fi
            npm run dist:win
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            if [[ "${{ matrix.mac_arch }}" == "arm64" ]]; then
              npx electron-builder --mac --arm64
            else
              npx electron-builder --mac --x64
            fi
          else
            npm run dist:linux
          fi

      - name: Staple notarization ticket (macOS, tags)
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'macOS'
        working-directory: desktop
        shell: bash
        run: |
          set -e
          echo "Stapling .app bundles..."
          find dist-app -type d -name "*.app" -print0 | xargs -0 -I{} xcrun stapler staple -v "{}" || true
          echo "Stapling DMG/ZIP artifacts..."
          find dist-app -type f \( -name "*.dmg" -o -name "*.zip" \) -print0 | xargs -0 -I{} xcrun stapler staple -v "{}" || true

      - name: Package and publish Windows MSIX (tags/releases)
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows'
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # Build and (if configured) publish Windows MSIX/AppX artifact
          npx electron-builder --win appx

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os == 'ubuntu-latest' && 'desktop-linux-latest' || (matrix.os == 'macos-latest' && format('desktop-macos-latest-{0}', matrix.mac_arch) || format('desktop-{0}', matrix.os)) }}
          path: |
            desktop/dist-app/**
            !desktop/dist-app/**/*.msix
            !desktop/dist-app/**/*.appx
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows MSIX artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-msix
          path: |
            desktop/dist-app/**/*.msix
            desktop/dist-app/**/*.appx
          if-no-files-found: warn
          retention-days: 7


