name: E2E (desktop app)

# Playwright tests that drive the desktop app (tests/e2e). They take several minutes, so they run
# when changes reach release-testing, or on demand from the Actions tab, rather than on every PR.
# The faster template tests in backend/tests run on every PR in ci (build.yml).
on:
  push:
    branches: [ release-testing ]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install JS deps (includes Electron)
        run: npm ci
      - name: Build shared and frontend
        run: |
          npm run build:shared
          npm run build:frontend
      - name: Backend venv
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r backend/requirements.txt
      - name: Install export tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q pandoc poppler-utils
          echo "$GITHUB_WORKSPACE/desktop/resources/tools/linux/amd64" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/Tectonic
          key: tectonic-${{ runner.os }}-v1
      - name: Build desktop main and preload
        working-directory: desktop
        run: npx electron-vite build
      - name: Run Playwright tests
        env:
          E2E_PREVIEW: '1'      # serve the built frontend instead of the Vite dev server
          E2E_SKIP_BUILD: '1'   # desktop already built above
        run: npm run test:e2e
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 14
