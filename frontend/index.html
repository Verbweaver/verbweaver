<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verbweaver - A writing and design platform</title>
  </head>
  <body>
    <script>
      try {
        var key = 'verbweaver_theme';
        var saved = localStorage.getItem(key);
        var theme = saved ? JSON.parse(saved).state?.theme || saved : null;
        if (typeof theme !== 'string') {
          theme = 'dark';
        }
        var classes = document.documentElement.classList;
        classes.remove('light','dark','high-contrast','colorblind','custom');
        if (theme === 'colorblind' || theme === 'high-contrast') {
          classes.add('dark');
        }
        classes.add(theme);
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
